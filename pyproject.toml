[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-aware-agentic-ai"
version = "0.1.0"
description = "Trust layer for A2A based on DIDs, Verifiable Credentials and Web of Trust"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "a2a-sdk>=1.2.2,<2",
]

[project.optional-dependencies]
examples = [
    "a2a-sdk[http-server]>=1.2.2,<2",
    "uvicorn>=0.54.0",
]
dev = [
    "trust-aware-agentic-ai[examples]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"